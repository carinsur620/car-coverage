<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | PrimeShield</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fa;
      color: #1f2937;
      min-height: 100vh;
    }

    header {
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
    }

    .navbar {
      max-width: 1200px;
      margin: auto;
      padding: 16px 25px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 25px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: #111827;
      font-size: 21px;
      font-weight: 800;
    }

    .logo svg {
      width: 42px;
      height: 42px;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 22px;
      flex-wrap: wrap;
    }

    nav a {
      text-decoration: none;
      color: #374151;
      font-size: 14px;
      font-weight: 600;
    }

    nav a:hover,
    nav a.active {
      color: #1769e0;
    }

    .login-btn {
      background: #1769e0;
      color: #ffffff !important;
      padding: 10px 17px;
      border-radius: 7px;
    }

    .login-btn:hover {
      background: #0f56bd;
    }

    .register-section {
      min-height: calc(100vh - 75px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 50px 20px;
      background:
        linear-gradient(rgba(8, 25, 50, 0.70), rgba(8, 25, 50, 0.70)),
        url("https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=1800&q=85")
        center/cover no-repeat;
    }

    .register-card {
      width: 100%;
      max-width: 470px;
      background: #ffffff;
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.20);
    }

    .register-logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .register-logo svg {
      width: 58px;
      height: 58px;
      margin-bottom: 10px;
    }

    .register-logo h1 {
      font-size: 28px;
      color: #111827;
      margin-bottom: 6px;
    }

    .register-logo p {
      color: #6b7280;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 17px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      color: #374151;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #1769e0;
      box-shadow: 0 0 0 3px rgba(23, 105, 224, 0.10);
    }

    input[readonly] {
      background: #f3f4f6;
      color: #374151;
      cursor: not-allowed;
    }

    .terms-row {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      margin: 20px 0;
    }

    .terms-row input {
      width: auto;
      margin-top: 4px;
    }

    .terms-row label {
      font-weight: 400;
      font-size: 13px;
      line-height: 1.5;
      margin: 0;
    }

    .terms-row a {
      color: #1769e0;
      text-decoration: none;
      font-weight: 600;
    }

    button {
      width: 100%;
      border: none;
      background: #1769e0;
      color: #ffffff;
      padding: 14px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #0f56bd;
    }

    button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .error-message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #b91c1c;
      border-radius: 8px;
      font-size: 14px;
      text-align: center;
    }

    .login-link {
      text-align: center;
      margin-top: 22px;
      color: #6b7280;
      font-size: 14px;
    }

    .login-link a {
      color: #1769e0;
      text-decoration: none;
      font-weight: 700;
    }

    .login-link a:hover {
      text-decoration: underline;
    }

    .back-home {
      display: block;
      text-align: center;
      margin-top: 15px;
      color: #6b7280;
      text-decoration: none;
      font-size: 13px;
    }

    .back-home:hover {
      color: #1769e0;
    }

    @media (max-width: 800px) {
      .navbar {
        flex-direction: column;
      }

      nav {
        justify-content: center;
      }

      .register-card {
        padding: 30px 22px;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header>
    <div class="navbar">

      <a href="index.html" class="logo">

        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M50 5 L90 20 V48 C90 72 74 89 50 97 C26 89 10 72 10 48 V20 Z"
            fill="#1769e0"
          />
          <path
            d="M50 16 L78 27 V48 C78 65 67 77 50 84 C33 77 22 65 22 48 V27 Z"
            fill="#ffffff"
          />
          <text
            x="50"
            y="58"
            text-anchor="middle"
            font-size="25"
            font-weight="bold"
            fill="#1769e0"
          >PS</text>
        </svg>

        PrimeShield

      </a>

      <nav>
        <a href="index.html">Home</a>
        <a href="plans.html">Plans</a>
        <a href="testimonials.html">Reviews</a>
        <a href="about.html">About</a>
        <a href="terms.html">Terms</a>
        <a href="contact.html">Contact</a>
        <a href="login.html" class="login-btn">Customer Login</a>
      </nav>

    </div>
  </header>


  <!-- REGISTER -->
  <main class="register-section">

    <div class="register-card">

      <div class="register-logo">

        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M50 5 L90 20 V48 C90 72 74 89 50 97 C26 89 10 72 10 48 V20 Z"
            fill="#1769e0"
          />
          <path
            d="M50 16 L78 27 V48 C78 65 67 77 50 84 C33 77 22 65 22 48 V27 Z"
            fill="#ffffff"
          />
          <text
            x="50"
            y="58"
            text-anchor="middle"
            font-size="25"
            font-weight="bold"
            fill="#1769e0"
          >PS</text>
        </svg>

        <h1>Create Your Account</h1>
        <p>Set up your PrimeShield customer account</p>

      </div>


      <form id="registerForm">

        <div class="form-group">
          <label for="email">Email Address</label>

          <input
            type="email"
            id="email"
            placeholder="you@example.com"
            required
          >
        </div>


        <div class="form-group">
          <label for="password">Password</label>

          <input
            type="password"
            id="password"
            placeholder="Create a password"
            minlength="6"
            required
          >
        </div>


        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>

          <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm your password"
            minlength="6"
            required
          >
        </div>


        <div class="form-group">
          <label for="registrationCode">Registration Code</label>

          <input
            type="text"
            id="registrationCode"
            placeholder="Enter your registration code"
            required
          >
        </div>


        <div class="terms-row">

          <input
            type="checkbox"
            id="terms"
            required
          >

          <label for="terms">
            I agree to the
            <a href="terms.html" target="_blank">
              Terms & Conditions
            </a>
            and understand the applicable coverage requirements.
          </label>

        </div>


        <button type="submit" id="registerButton">
          Create Account
        </button>

        <div class="error-message" id="errorMessage"></div>

      </form>


      <div class="login-link">
        Already have an account?
        <a href="login.html">Sign in</a>
      </div>

      <a href="index.html" class="back-home">
        ← Back to PrimeShield
      </a>

    </div>

  </main>


  <!-- FIREBASE -->
  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getAuth,
      createUserWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    import {
      getFirestore,
      doc,
      setDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


    // NEW FIREBASE PROJECT
    const firebaseConfig = {
      apiKey: "AIzaSyB1Xsl0TEikQROPX-rueVtQCFwvdx9FxNY",
      authDomain: "carinsurance-784eb.firebaseapp.com",
      projectId: "carinsurance-784eb",
      storageBucket: "carinsurance-784eb.firebasestorage.app",
      messagingSenderId: "181837106063",
      appId: "1:181837106063:web:9357e10fb6738a07a4d9fa",
      measurementId: "G-0X0VX4Q76R"
    };


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getFirestore(app);


    /*
      Registration codes connected to plans.
    */

    const plans = {
      PRIME123: {
        name: "Basic Plan",
        price: "$299"
      },

      PRIME456: {
        name: "Standard Plan",
        price: "$499"
      },

      PRIME789: {
        name: "Premium Plan",
        price: "$799"
      }
    };


    /*
      Automatically read the code from:
      register.html?code=PRIME123
    */

    const urlParams = new URLSearchParams(window.location.search);

    const codeFromURL = urlParams.get("code");


    if (codeFromURL) {

      const cleanCode = codeFromURL.trim().toUpperCase();

      document.getElementById("registrationCode").value = cleanCode;

      document.getElementById("registrationCode").readOnly = true;
    }


    const registerForm =
      document.getElementById("registerForm");

    const registerButton =
      document.getElementById("registerButton");

    const errorMessage =
      document.getElementById("errorMessage");


    registerForm.addEventListener("submit", async (event) => {

      event.preventDefault();


      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      const confirmPassword =
        document.getElementById("confirmPassword").value;

      const registrationCode =
        document.getElementById("registrationCode").value
          .trim()
          .toUpperCase();


      errorMessage.style.display = "none";


      // Check passwords
      if (password !== confirmPassword) {

        errorMessage.textContent =
          "Passwords do not match.";

        errorMessage.style.display = "block";

        return;
      }


      // Check registration code
      if (!plans[registrationCode]) {

        errorMessage.textContent =
          "Invalid registration code.";

        errorMessage.style.display = "block";

        return;
      }


      registerButton.disabled = true;

      registerButton.textContent =
        "Creating Account...";


      try {

        /*
          STEP 1:
          Create Firebase Authentication account.
        */

        const userCredential =
          await createUserWithEmailAndPassword(
            auth,
            email,
            password
          );


        const user =
          userCredential.user;


        /*
          STEP 2:
          Create the customer's Firestore profile.
        */

        await setDoc(
          doc(db, "users", user.uid),
          {
            email: user.email,

            planCode: registrationCode,

            planName: plans[registrationCode].name,

            planPrice: plans[registrationCode].price,

            status: "waiting",

            blocked: false,

            createdAt: serverTimestamp(),

            updatedAt: serverTimestamp()
          }
        );


        /*
          STEP 3:
          Send customer to dashboard.
        */

        window.location.href =
          "dashboard.html";


      } catch (error) {

        console.error(error);


        let message =
          "Unable to create your account. Please try again.";


        if (error.code === "auth/email-already-in-use") {

          message =
            "An account with this email already exists.";
        }


        if (error.code === "auth/invalid-email") {

          message =
            "Please enter a valid email address.";
        }


        if (error.code === "auth/weak-password") {

          message =
            "Password must be at least 6 characters.";
        }


        if (
          error.code === "permission-denied" ||
          error.code === "firestore/permission-denied"
        ) {

          message =
            "Your account was created, but your customer profile could not be saved. Please contact support.";
        }


        errorMessage.textContent = message;

        errorMessage.style.display = "block";


        registerButton.disabled = false;

        registerButton.textContent =
          "Create Account";
      }

    });

  </script>

</body>
</html>
